[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Two desktop apps share this site and its licensing code (netlify/functions/_shared), each under its own prefix.

# ---------------------------------------------------------------------------
# USG Reporting app - everything under /usg/. Contract: docs/LICENSE_SERVER_API.md in the app repository.
# The public /usg/activate page (QR code -> phone) is served by the SPA fallback below.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/usg/api/activate"
  to = "/.netlify/functions/usg-activate"
  status = 200

[[redirects]]
  from = "/usg/api/sync"
  to = "/.netlify/functions/usg-sync"
  status = 200

[[redirects]]
  from = "/usg/api/dev-reset-request"
  to = "/.netlify/functions/usg-dev-reset-request"
  status = 200

[[redirects]]
  from = "/usg/api/offline-activate"
  to = "/.netlify/functions/usg-offline-activate"
  status = 200

[[redirects]]
  from = "/usg/api/update"
  to = "/.netlify/functions/usg-update"
  status = 200

[[redirects]]
  from = "/usg/api/update/download"
  to = "/.netlify/functions/usg-update-download"
  status = 200

# Anything else under /usg/api/ is a JSON 404, never the dashboard's HTML.
[[redirects]]
  from = "/usg/api/*"
  to = "/.netlify/functions/usg-not-found"
  status = 404

# ---------------------------------------------------------------------------
# SMRG app (Smart Medical Report Generator) - everything under /smrg/. Contract: docs/LICENSE_SERVER_API.md in the app repository.
# The public /smrg/activate page (QR code -> phone) is served by the SPA fallback below.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/smrg/api/activate"
  to = "/.netlify/functions/smrg-activate"
  status = 200

[[redirects]]
  from = "/smrg/api/sync"
  to = "/.netlify/functions/smrg-sync"
  status = 200

[[redirects]]
  from = "/smrg/api/dev-reset-request"
  to = "/.netlify/functions/smrg-dev-reset-request"
  status = 200

[[redirects]]
  from = "/smrg/api/offline-activate"
  to = "/.netlify/functions/smrg-offline-activate"
  status = 200

[[redirects]]
  from = "/smrg/api/update"
  to = "/.netlify/functions/smrg-update"
  status = 200

[[redirects]]
  from = "/smrg/api/update/download"
  to = "/.netlify/functions/smrg-update-download"
  status = 200

# Anything else under /smrg/api/ is a JSON 404, never the dashboard's HTML.
[[redirects]]
  from = "/smrg/api/*"
  to = "/.netlify/functions/smrg-not-found"
  status = 404

# SPA fallback for the React dashboard (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
