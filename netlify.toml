[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# These make the deployed site match ActivationApiClient.cs exactly, so the C# app's
# BaseUrl can just be "https://your-subdomain.yoursite.com" with no other changes -
# e.g. BaseUrl + "/activateTrial" resolves here instead of needing "/.netlify/functions/activate-trial".
[[redirects]]
  from = "/activateTrial"
  to = "/.netlify/functions/activate-trial"
  status = 200

[[redirects]]
  from = "/requestFinalActivation"
  to = "/.netlify/functions/request-final-activation"
  status = 200

[[redirects]]
  from = "/checkFinalActivation"
  to = "/.netlify/functions/check-final-activation"
  status = 200

# Public, no-login endpoint the phone-facing "/activate" page calls after someone
# scans the Offline-Activation QR code. Trial-issuance only (see the function file
# for why Final requests are always rejected here).
[[redirects]]
  from = "/activateOfflineTrial"
  to = "/.netlify/functions/activate-offline-trial"
  status = 200

# ---------------------------------------------------------------------------
# USG Reporting app (the NEW desktop app) - everything under /usg/ so it can
# never collide with the SMRG routes above. Contract: Software Code/docs/LICENSE_SERVER_API.md
# The public /usg/activate page (QR code -> phone) is served by the SPA fallback below.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/usg/api/activate"
  to = "/.netlify/functions/usg-activate"
  status = 200

[[redirects]]
  from = "/usg/api/sync"
  to = "/.netlify/functions/usg-sync"
  status = 200

[[redirects]]
  from = "/usg/api/dev-reset-request"
  to = "/.netlify/functions/usg-dev-reset-request"
  status = 200

[[redirects]]
  from = "/usg/api/offline-activate"
  to = "/.netlify/functions/usg-offline-activate"
  status = 200

[[redirects]]
  from = "/usg/api/update"
  to = "/.netlify/functions/usg-update"
  status = 200

[[redirects]]
  from = "/usg/api/update/download"
  to = "/.netlify/functions/usg-update-download"
  status = 200

# Anything else under /usg/api/ is a JSON 404, never the dashboard's HTML.
[[redirects]]
  from = "/usg/api/*"
  to = "/.netlify/functions/usg-not-found"
  status = 404

# SPA fallback for the React dashboard (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
